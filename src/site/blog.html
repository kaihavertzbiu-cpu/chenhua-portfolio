:root{
  --bg:#f6f3ee;
  --bg-2:#fbfaf7;
  --card:#ffffff;
  --line:#e7dfd3;

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
a{text-decoration:none;color:inherit} img{max-width:100%;display:block} button{font:inherit}
.wrap{width:min(1120px,calc(100% - 40px));margin:0 auto}
.page-glow{display:none}

.nav-inner{display:flex;justify-content:space-between;align-items:center;min-height:72px;gap:18px}
.brand{display:flex;align-items:center;gap:12px}.brand-mark{width:38px;height:38px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-weight:800;color:var(--accent)}.brand-title{font-weight:700;font-size:14px}.brand-sub{font-size:12px;color:var(--muted)}

.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:44px;padding:72px 0 42px}.eyebrow,.section-kicker,.label-chip,.blog-label{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.04em;text-transform:uppercase}.hero h1{margin:14px 0 18px;font-family:"Noto Serif SC","PingFang SC",serif;font-size:58px;line-height:1.16;letter-spacing:-.03em;font-weight:700}.hero h1 strong{color:var(--accent)}.hero-text{font-size:17px;line-height:1.95;color:var(--muted);max-width:720px}.hero-pills,.tag-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.hero-pills span,.tag-row span{font-size:13px;color:#544c44;border:1px solid var(--line);padding:8px 12px;border-radius:999px;background:#fff}.hero-actions,.center-action,.project-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid transparent;font-weight:700;transition:.18s ease}.btn:hover{transform:translateY(-1px)}.btn-primary{background:var(--accent);color:#fff}.btn-secondary{background:#fff;border-color:var(--line);color:var(--text)}

.portrait-card{padding:0;background:none;border:none;box-shadow:none}.portrait-frame{aspect-ratio:4/5;border-radius:18px;overflow:hidden;background:#ddd}.portrait-frame img{width:100%;height:100%;object-fit:cover;object-position:center 30%}.portrait-caption{padding-top:12px}.portrait-name{font-weight:700;font-size:16px}.portrait-role{font-size:13px;color:var(--muted);margin-top:4px}

.analysis-details{display:grid;gap:14px;margin-top:16px}.detail-card{background:#fff}.detail-card summary{list-style:none;cursor:pointer;padding:20px 22px}.detail-card summary::-webkit-details-marker{display:none}.detail-card summary h3{margin:0 0 8px;font-family:"Noto Serif SC","PingFang SC",serif;font-size:24px}.detail-card summary p{margin:0;color:var(--muted)}.detail-body{padding:0 22px 22px}.detail-grid{display:grid;gap:18px}.two-col{grid-template-columns:1fr 1fr}.detail-body h4{margin:0 0 8px;font-size:16px}.detail-body ul{margin:0;padding-left:18px;color:var(--muted);line-height:1.9}.table-shell{margin-top:18px;border:1px solid var(--line);border-radius:14px;overflow:auto;background:#fff}.table-shell table{width:100%;border-collapse:collapse;min-width:640px}.table-shell th,.table-shell td{padding:13px 14px;text-align:left;border-bottom:1px solid #f0ebe3;font-size:14px}.table-shell th{background:#faf7f2;color:#5c534a}.note-box{margin-top:18px;padding:16px 18px;border-radius:14px;background:#fbf6f0;border:1px solid var(--line);line-height:1.9}
